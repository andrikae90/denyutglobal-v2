name: Security Step 2 Patch
on:
  push:
    branches:
      - security/step-2-subscription-status
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove public unsubscribe token
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker.ts')
          s = p.read_text()
          old = """            return jsonResponse({\n              success: true,\n              exists: true,\n              status,\n              isSubscribed: status === 'active',\n              token: status === 'active' ? token : undefined\n            });"""
          new = """            return jsonResponse({\n              success: true,\n              isSubscribed: status === 'active'\n            });"""
          if old not in s:
              raise SystemExit('Target subscription-status response block not found; no changes made.')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.ts
          git commit -m "security: stop exposing unsubscribe token in subscription status" || exit 0
          git push
