name: Security Step 3 Patch

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'prepare temporary security step 3 patch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Harden editorial D1 mutations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker.ts')
          s = p.read_text()
          replacements = [
          ("""      if (!await verifyWorkerEditorialToken(authHeader, env)) {\n        return jsonResponse({ success: false, error: 'Akses ditolak. Sesi otorisasi redaksi tidak valid atau kedaluwarsa.' }, 401);\n      }\n\n      try {\n        const articlePayload: any = await request.json();""", """      if (!await verifyWorkerEditorialToken(authHeader, env)) {\n        return jsonResponse({ success: false, error: 'Akses ditolak. Sesi otorisasi redaksi tidak valid atau kedaluwarsa.' }, 401);\n      }\n      if (!env.DB) {\n        return jsonResponse({ success: false, error: 'Cloudflare D1 belum tersedia. Operasi penyimpanan dibatalkan.' }, 503);\n      }\n\n      try {\n        const articlePayload: any = await request.json();"""),
          ("""        // Update in-memory fallback\n        existingIdx = memoryArticlesCache.findIndex(a => a.id === normalized.id);\n        if (existingIdx >= 0) {\n          memoryArticlesCache[existingIdx] = normalized;\n        } else {\n          memoryArticlesCache.unshift(normalized);\n        }\n\n        if (d1Result.success) {""", """        if (d1Result.success) {\n          // Update cache only after D1 confirms the write.\n          existingIdx = memoryArticlesCache.findIndex(a => a.id === normalized.id);\n          if (existingIdx >= 0) {\n            memoryArticlesCache[existingIdx] = normalized;\n          } else {\n            memoryArticlesCache.unshift(normalized);\n          }"""),
          ("""        if (env.DB) {\n          return jsonResponse({\n            success: false,\n            d1_persisted: false,\n            d1_source: 'd1_binding',\n            error: d1Result.error,\n            message: 'Gagal mengeksekusi INSERT ke Cloudflare D1: ' + d1Result.error,\n            data: normalized\n          }, 502);\n        }\n\n        return jsonResponse({\n          success: true,\n          d1_persisted: false,\n          d1_source: 'server_store',\n          warning: 'Data tersimpan di memori cache runtime.',\n          data: normalized\n        });""", """        return jsonResponse({\n          success: false,\n          d1_persisted: false,\n          d1_source: 'd1_binding',\n          error: d1Result.error || 'D1 write failed.',\n          message: 'Gagal menyimpan artikel ke Cloudflare D1. Tidak ada perubahan cache yang dilaporkan sebagai berhasil.'\n        }, 502);"""),
          ("""      if (!await verifyWorkerEditorialToken(authHeader, env)) {\n        return jsonResponse({ success: false, error: 'Akses ditolak.' }, 401);\n      }\n\n      try {\n        const id = decodeURIComponent(pathname.replace('/api/editorial/articles/', '').trim());\n        const updateData: any = await request.json();""", """      if (!await verifyWorkerEditorialToken(authHeader, env)) {\n        return jsonResponse({ success: false, error: 'Akses ditolak.' }, 401);\n      }\n      if (!env.DB) {\n        return jsonResponse({ success: false, error: 'Cloudflare D1 belum tersedia. Operasi pembaruan dibatalkan.' }, 503);\n      }\n\n      try {\n        const id = decodeURIComponent(pathname.replace('/api/editorial/articles/', '').trim());\n        const updateData: any = await request.json();"""),
          ("""        if (existingIdx >= 0) {\n          memoryArticlesCache[existingIdx] = updated;\n        } else {\n          memoryArticlesCache.unshift(updated);\n        }\n\n        if (d1Result.success) {""", """        if (d1Result.success) {\n          // Update cache only after D1 confirms the write.\n          if (existingIdx >= 0) {\n            memoryArticlesCache[existingIdx] = updated;\n          } else {\n            memoryArticlesCache.unshift(updated);\n          }"""),
          ("""        return jsonResponse({\n          success: true,\n          d1_persisted: false,\n          d1_source: 'server_store',\n          data: updated\n        });""", """        return jsonResponse({\n          success: false,\n          d1_persisted: false,\n          d1_source: 'd1_binding',\n          error: d1Result.error || 'D1 write failed.',\n          message: 'Gagal memperbarui artikel di Cloudflare D1. Perubahan tidak dianggap berhasil.'\n        }, 502);"""),
          ("""      if (!await verifyWorkerEditorialToken(authHeader, env)) {\n        return jsonResponse({ success: false, error: 'Akses ditolak.' }, 401);\n      }\n\n      const id = decodeURIComponent(pathname.replace('/api/editorial/articles/', '').trim());\n      const d1Result = await executeWorkerD1Query(env.DB, 'DELETE FROM articles WHERE id = ?', [id]);\n\n      memoryArticlesCache = memoryArticlesCache.filter(a => a.id !== id);\n\n      return jsonResponse({\n        success: true,\n        d1_deleted: d1Result.success,\n        d1_source: 'd1_binding',\n        message: d1Result.success ? 'Artikel berhasil dihapus dari Cloudflare D1.' : 'Artikel dihapus dari memori.',\n        deletedId: id\n      });""", """      if (!await verifyWorkerEditorialToken(authHeader, env)) {\n        return jsonResponse({ success: false, error: 'Akses ditolak.' }, 401);\n      }\n      if (!env.DB) {\n        return jsonResponse({ success: false, error: 'Cloudflare D1 belum tersedia. Operasi penghapusan dibatalkan.' }, 503);\n      }\n\n      const id = decodeURIComponent(pathname.replace('/api/editorial/articles/', '').trim());\n      const d1Result = await executeWorkerD1Query(env.DB, 'DELETE FROM articles WHERE id = ?', [id]);\n\n      if (!d1Result.success) {\n        return jsonResponse({ success: false, d1_deleted: false, d1_source: 'd1_binding', error: d1Result.error || 'D1 delete failed.', message: 'Gagal menghapus artikel dari Cloudflare D1.' }, 502);\n      }\n\n      memoryArticlesCache = memoryArticlesCache.filter(a => a.id !== id);\n\n      return jsonResponse({\n        success: true,\n        d1_deleted: true,\n        d1_source: 'd1_binding',\n        message: 'Artikel berhasil dihapus dari Cloudflare D1.',\n        deletedId: id\n      });"""),
          ("""      if (!await verifyWorkerEditorialToken(authHeader, env)) {\n        return jsonResponse({ success: false, error: 'Akses ditolak.' }, 401);\n      }\n\n      try {\n        const body: any = await request.json();""", """      if (!await verifyWorkerEditorialToken(authHeader, env)) {\n        return jsonResponse({ success: false, error: 'Akses ditolak.' }, 401);\n      }\n      if (!env.DB) {\n        return jsonResponse({ success: false, error: 'Cloudflare D1 belum tersedia. Sinkronisasi dibatalkan.' }, 503);\n      }\n\n      try {\n        const body: any = await request.json();"""),
          ("""        let d1Count = 0;\n        for (const item of articles) {""", """        let d1Count = 0;\n        const syncedArticles: NewsItem[] = [];\n        for (const item of articles) {"""),
          ("""          if (res.success) d1Count++;\n\n          idx = memoryArticlesCache.findIndex(a => a.id === norm.id || (a.slug && a.slug === norm.slug));\n          if (idx >= 0) {\n            memoryArticlesCache[idx] = norm;\n          } else {\n            memoryArticlesCache.push(norm);\n          }""", """          if (!res.success) {\n            return jsonResponse({ success: false, d1_synced_count: d1Count, error: res.error || 'D1 batch item failed.', message: 'Sinkronisasi dibatalkan karena ada penulisan D1 yang gagal.' }, 502);\n          }\n          d1Count++;\n          syncedArticles.push(norm);"""),
          ("""        return jsonResponse({\n          success: true,\n          d1_synced_count: d1Count,\n          message: `Sinkronisasi batch selesai. (${d1Count} tercatat di D1)`,\n          total: memoryArticlesCache.length\n        });""", """        for (const norm of syncedArticles) {\n          const idx = memoryArticlesCache.findIndex(a => a.id === norm.id || (a.slug && a.slug === norm.slug));\n          if (idx >= 0) memoryArticlesCache[idx] = norm;\n          else memoryArticlesCache.push(norm);\n        }\n\n        return jsonResponse({\n          success: true,\n          d1_synced_count: d1Count,\n          message: `Sinkronisasi batch selesai. (${d1Count} tercatat di D1)`,\n          total: memoryArticlesCache.length\n        });""")]
          changed = 0
          for old, new in replacements:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'Expected exactly 1 match, got {n}: {old[:90]!r}')
              s = s.replace(old, new, 1)
              changed += 1
          p.write_text(s)
          print(f'Applied {changed} replacements')
          PY
      - name: Type check
        run: npm run lint
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.ts
          git rm .github/workflows/security-step-3-patch.yml
          git commit -m "security: fail closed when editorial D1 mutations fail"
          git push