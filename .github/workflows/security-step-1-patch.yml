name: Security Step 1 - Editorial Auth Fail Closed

on:
  push:
    branches:
      - security/step-1-editorial-auth-fail-closed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-editorial-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove hardcoded editorial auth fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path('worker.ts')
          text = path.read_text(encoding='utf-8')

          old_default = "const DEFAULT_EDITORIAL_HASH = '518f21a9a8470c890258ddaa2dc85c5483f597e22d7dc4b4a825208aa0eb1ea7';\n"
          if old_default not in text:
              raise SystemExit('PATCH_ABORT: hardcoded editorial hash declaration not found')
          text = text.replace(old_default, '', 1)

          old_verify = "const targetHash = (env.EDITORIAL_PASSPHRASE_SHA256_HASH || DEFAULT_EDITORIAL_HASH).toLowerCase();\n        const expectedSig = await sha256Hex(`${expHex}:${targetHash}`);"
          new_verify = "const targetHash = (env.EDITORIAL_PASSPHRASE_SHA256_HASH || '').trim().toLowerCase();\n        if (!targetHash) return false;\n        const expectedSig = await sha256Hex(`${expHex}:${targetHash}`);"
          if old_verify not in text:
              raise SystemExit('PATCH_ABORT: verifyWorkerEditorialToken fallback expression not found')
          text = text.replace(old_verify, new_verify, 1)

          old_auth = "const targetHash = (env.EDITORIAL_PASSPHRASE_SHA256_HASH || DEFAULT_EDITORIAL_HASH).toLowerCase();\n        let inputHash = '';"
          new_auth = "const targetHash = (env.EDITORIAL_PASSPHRASE_SHA256_HASH || '').trim().toLowerCase();\n        if (!targetHash) {\n          return jsonResponse({ success: false, error: 'Autentikasi Ruang Redaksi belum dikonfigurasi di Cloudflare Secret.' }, 503);\n        }\n        let inputHash = '';"
          if old_auth not in text:
              raise SystemExit('PATCH_ABORT: editorial auth fallback expression not found')
          text = text.replace(old_auth, new_auth, 1)

          if 'DEFAULT_EDITORIAL_HASH' in text:
              raise SystemExit('PATCH_ABORT: DEFAULT_EDITORIAL_HASH still referenced')

          path.write_text(text, encoding='utf-8')
          print('PATCH_OK: editorial authentication now fails closed without configured passphrase hash')

      - name: Verify patch
        run: |
          grep -n "EDITORIAL_PASSPHRASE_SHA256_HASH" worker.ts
          if grep -n "DEFAULT_EDITORIAL_HASH" worker.ts; then
            echo "FAIL: hardcoded editorial hash still exists"
            exit 1
          fi

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- worker.ts; then
            echo "No worker.ts changes needed; patch already applied."
            exit 0
          fi
          git add worker.ts
          git commit -m "security: remove hardcoded editorial auth fallback"
          git push origin HEAD:security/step-1-editorial-auth-fail-closed
